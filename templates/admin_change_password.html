<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change password — SchoolVoice</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">SchoolVoice</span>
      <span class="brand-tag">Change password</span>
    </div>
    <div style="display:flex; align-items:center; gap:14px;">
      <a href="{{ url_for('admin_dashboard') }}" class="btn btn-ghost">← Dashboard</a>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <span class="knob" id="themeKnob">☀︎</span>
      </button>
    </div>
  </header>

  <section class="login-wrap">
    <form class="login-card reveal" method="POST">
      <p class="eyebrow">Your account</p>
      <h1>Change password</h1>

      {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
      {% if success %}<div class="login-success">{{ success }}</div>{% endif %}

      <div class="field" style="margin-top: 22px;">
        <label for="current_password">Current password</label>
        <input type="password" id="current_password" name="current_password" required>
      </div>
      <div class="field">
        <label for="new_password">New password</label>
        <input type="password" id="new_password" name="new_password" minlength="8" required>
        <p class="hint">At least 8 characters.</p>
      </div>
      <div class="field">
        <label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" minlength="8" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:8px;">Update password →</button>
      <a href="{{ url_for('admin_dashboard') }}" class="back-link">← Back to dashboard</a>
    </form>
  </section>
</div>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>
</html>
